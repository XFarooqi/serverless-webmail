AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static portfolio on your own domain: private S3 bucket + CloudFront (Origin Access Control),
  free ACM certificate, www-to-apex redirect and sub-folder index pages. No servers, no Route 53.

Parameters:
  DomainName:
    Type: String
    Description: Your domain without www, e.g. example.com
    AllowedPattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$'
  CertificateArn:
    Type: String
    Description: ISSUED ACM certificate in us-east-1 for DomainName and www.DomainName
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+$'

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256          # S3-managed keys are free (a KMS key would be $1/month)
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowThisDistributionOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # www -> apex, /projects -> /projects/, /projects/ -> /projects/index.html (query strings kept)
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: www to apex redirect and directory index rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // keep ?query=strings on redirects
        function qs(req) {
          var parts = [];
          for (var k in req.querystring) {
            var p = req.querystring[k];
            var vals = p.multiValue ? p.multiValue : [p];
            for (var i = 0; i < vals.length; i++) parts.push(vals[i].value === '' ? k : k + '=' + vals[i].value);
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        function redirect(url) {
          return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: url } } };
        }
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : '';
          if (host.indexOf('www.') === 0) return redirect('https://' + host.substring(4) + req.uri + qs(req));
          if (req.uri.endsWith('/')) {
            req.uri += 'index.html';                       // /projects/ -> /projects/index.html
          } else if (req.uri.split('/').pop().indexOf('.') === -1) {
            return redirect(req.uri + '/' + qs(req));      // /projects -> /projects/ (delete this branch for SPAs)
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Portfolio for ${DomainName}'
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100          # North America + Europe edges; cheapest class
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6           # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:              # a private bucket answers 403 for missing files
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point your root (ALIAS) and www (CNAME) records here
    Value: !GetAtt Distribution.DomainName
